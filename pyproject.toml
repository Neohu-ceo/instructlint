[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "instructlint"
version = "0.1.2"
description = "Static analysis for cross-agent repository instructions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Neohu-ceo" }]
keywords = [
  "agents",
  "agents-md",
  "claude-code",
  "copilot",
  "cursor",
  "developer-tools",
  "linter",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Neohu-ceo/instructlint"
Issues = "https://github.com/Neohu-ceo/instructlint/issues"
Changelog = "https://github.com/Neohu-ceo/instructlint/blob/main/CHANGELOG.md"

[project.scripts]
instructlint = "instructlint.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
