name: InstructLint
description: Lint coding-agent instruction files for conflicts, stale references, and unsafe commands
author: Neohu-ceo

branding:
  icon: check-circle
  color: green

inputs:
  path:
    description: Repository path to scan
    required: false
    default: "."
  fail-on:
    description: Lowest severity that fails the action (error, warning, info, or none)
    required: false
    default: error
  format:
    description: Output format (text, json, or sarif)
    required: false
    default: text
  max-bytes:
    description: Maximum instruction-file size before reporting CTX001
    required: false
    default: "12000"
  python-version:
    description: Python version used to run InstructLint
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs['python-version'] }}

    - name: Install InstructLint
      shell: bash
      env:
        INSTRUCTLINT_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$INSTRUCTLINT_ACTION_PATH"

    - name: Scan agent instructions
      shell: bash
      env:
        INSTRUCTLINT_PATH: ${{ inputs.path }}
        INSTRUCTLINT_FAIL_ON: ${{ inputs['fail-on'] }}
        INSTRUCTLINT_FORMAT: ${{ inputs.format }}
        INSTRUCTLINT_MAX_BYTES: ${{ inputs['max-bytes'] }}
      run: >-
        instructlint scan "$INSTRUCTLINT_PATH"
        --fail-on "$INSTRUCTLINT_FAIL_ON"
        --format "$INSTRUCTLINT_FORMAT"
        --max-bytes "$INSTRUCTLINT_MAX_BYTES"
